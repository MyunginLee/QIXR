[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qixr-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "numpy>=2,<3", "scipy>=1.14,<2", "httpx>=0.27,<1", "python-multipart>=0.0.18"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "sherpa-onnx>=1.12,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["qixr_companion*"]

[tool.setuptools.package-data]
qixr_companion = ["prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
